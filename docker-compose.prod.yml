# Setup 2: Production Multi-Stage Full-Stack Platform
# Highly optimized, standalone Next.js 16 build + multi-worker FastAPI runner + Nginx reverse proxy.
services:
  nginx:
    image: nginx:alpine
    container_name: genui-prod-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: genui-prod-backend
    restart: always
    expose:
      - "8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/genui_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://silo:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-siloadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-silopassword}
      - S3_BUCKET_NAME=genui-artifacts
      - CORS_ORIGINS=["http://localhost", "https://yourdomain.com"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: genui-prod-frontend
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - NEXTAUTH_URL=http://localhost
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-production-super-secret-key-change-me-32chars}
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: genui-prod-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: genui_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d genui_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: genui-prod-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  silo:
    image: pgsty/silo:latest
    container_name: genui-prod-silo
    restart: always
    command: silo server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-siloadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-silopassword}
    volumes:
      - silo_prod_data:/data

volumes:
  postgres_prod_data:
  redis_prod_data:
  silo_prod_data:

