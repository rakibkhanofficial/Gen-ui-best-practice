# Docker Compose for GenUI Practice & Presentation Platform
# Backing services: PostgreSQL, Redis, and Silo S3-Compatible Object Storage (pgsty/silo)
# Environment parameters are loaded from .env

services:
  postgres:
    image: postgres:16-alpine
    container_name: genui-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genui_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-genui_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: genui-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  silo:
    image: pgsty/silo:latest
    container_name: genui-silo
    restart: unless-stopped
    command: silo server /data --console-address ":9001"
    ports:
      - "${SILO_PORT:-9000}:9000"
      - "${SILO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${SILO_ACCESS_KEY:-siloadmin}
      MINIO_ROOT_PASSWORD: ${SILO_SECRET_KEY:-silopassword}
    volumes:
      - silo_data:/data

volumes:
  postgres_data:
  redis_data:
  silo_data:
